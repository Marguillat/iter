server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : les routes cote client (/passport/:gtin) doivent retomber sur index.html
    # sinon un rafraichissement ou un lien direct renvoie 404.
    # nginx ne connait pas l'extension .webmanifest (sinon application/octet-stream).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
