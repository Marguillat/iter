# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Workflow Iter

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types:
      - closed
env:
  registry: ghcr.io
  image_name: ${{ github.repository }}

jobs:
  open-API:
    uses: ./.github/workflows/open-API.yml
    secrets: inherit
    with:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  open-FRONT:
    uses: ./.github/workflows/open-FRONT.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy to Production
    environment: Production
    runs-on: ubuntu-latest
    needs: [open-FRONT, open-API]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          CR_USER: ${{ github.actor }}
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CR_USER,CR_PAT
          script: |
            cd /home/ubuntu/apps/iter

            # 1. Log into GHCR on the VPS server using the passed variables
            echo "$CR_PAT" | docker login ghcr.io -u "$CR_USER" --password-stdin

            echo "pulling images ..."
            docker compose pull

            echo "downing containers ..."
            docker compose down

            echo "composing images ..."
            docker compose up -d --remove-orphans

            # 2. Optional: Logout after you are done to protect the temporary token
            docker logout ghcr.io

            echo "deleting unused content"
            docker system prune -a -f
